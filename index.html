    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [userEmail, setUserEmail] = useState('');
      const [userPassword, setUserPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      // Form Options
      const [ageCategory, setAgeCategory] = useState('junior');
      const [experienceLevel, setExperienceLevel] = useState('Principiante');
      const [availableMinutes, setAvailableMinutes] = useState(30);

      // Target Objectives State
      const [selectedObjectives, setSelectedObjectives] = useState([
        '1. Técnica y propiocepción',
        '2. Óculo-manual y reconocimiento',
        '3. Timing',
        '4. Capacidades físicas',
        '5. Táctica y mentalidad'
      ]);

      // Session State
      const [currentSession, setCurrentSession] = useState(null);
      const [completedBlockIds, setCompletedBlockIds] = useState([]);
      const [expandedDrillIndex, setExpandedDrillIndex] = useState(null);
      const [randomQuote, setRandomQuote] = useState(MOTIVATIONAL_QUOTES[0]);
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

      const routineRef = useRef(null);

      const toggleObjective = (objName) => {
        if (selectedObjectives.includes(objName)) {
          if (selectedObjectives.length > 1) {
            setSelectedObjectives(selectedObjectives.filter(o => o !== objName));
          }
        } else {
          if (selectedObjectives.length < 5) {
            setSelectedObjectives([...selectedObjectives, objName]);
          }
        }
      };

      const selectAllObjectives = () => {
        setSelectedObjectives([
          '1. Técnica y propiocepción',
          '2. Óculo-manual y reconocimiento',
          '3. Timing',
          '4. Capacidades físicas',
          '5. Táctica y mentalidad'
        ]);
      };

      const toggleDrillCompletion = (blockIndex) => {
        if (completedBlockIds.includes(blockIndex)) {
          setCompletedBlockIds(completedBlockIds.filter(id => id !== blockIndex));
        } else {
          setCompletedBlockIds([...completedBlockIds, blockIndex]);
        }
      };

      const toggleExpandDrill = (idx) => {
        setExpandedDrillIndex(expandedDrillIndex === idx ? null : idx);
      };

      const generateSession = () => {
        const categoryData = VOLUME_MATRIX[ageCategory] || VOLUME_MATRIX['junior'];
        const matrixConfig = categoryData[experienceLevel] || categoryData['Principiante'];

        let adjustedTotalSwings = matrixConfig.totalSwings;

        const levelModeMap = { 'Principiante': 0, 'Intermedio': 1, 'Avanzado': 2 };
        const modeIndex = levelModeMap[experienceLevel] !== undefined ? levelModeMap[experienceLevel] : 0;
        const targetDiff = modeIndex + 1;

        const areaKeyMap = {
          '1. Técnica y propiocepción': 'TP',
          '2. Óculo-manual y reconocimiento': 'O',
          '3. Timing': 'T',
          '4. Capacidades físicas': 'CF',
          '5. Táctica y mentalidad': 'TM'
        };

        const selectedAreaKeys = selectedObjectives.map(o => areaKeyMap[o]);

        let totalPctSelected = 0;
        selectedAreaKeys.forEach(key => {
          let p = matrixConfig.dist[key] ? matrixConfig.dist[key].pct : 0;
          totalPctSelected += p;
        });

        if (totalPctSelected === 0) totalPctSelected = 1;

        const TARGET_BLOCK_COUNT = 5;
        let blocks = [];
        let usedDrillIds = new Set();
        let calculatedSwingsSum = 0;

        let slots = [];
        for (let i = 0; i < TARGET_BLOCK_COUNT; i++) {
          slots.push(selectedAreaKeys[i % selectedAreaKeys.length]);
        }

        slots.forEach((areaKey) => {
          let origAreaInfo = matrixConfig.dist[areaKey] || { pct: 20, series: 2, reps: 10 };
          
          if (experienceLevel === 'Principiante' && areaKey === 'CF') {
            if (ageCategory === 'infantil') {
              origAreaInfo = { pct: 10, series: 2, reps: 8 };
            } else if (ageCategory === 'junior') {
              origAreaInfo = { pct: 10, series: 2, reps: 10 };
            } else if (ageCategory === 'juvenil' || ageCategory === 'adulto') {
              origAreaInfo = { pct: 10, series: 3, reps: 12 };
            }
          }

          let origPct = origAreaInfo.pct > 0 ? origAreaInfo.pct : (100 / selectedAreaKeys.length);
          let areaWeight = (origPct / totalPctSelected) / (TARGET_BLOCK_COUNT / selectedAreaKeys.length);
          let blockSwingsTarget = Math.round(adjustedTotalSwings * areaWeight);

          let repsPerSet = origAreaInfo.reps > 0 ? origAreaInfo.reps : 10;
          let calculatedSeries = Math.max(1, Math.round(blockSwingsTarget / repsPerSet));
          
          if (experienceLevel === 'Principiante' && areaKey === 'CF') {
            calculatedSeries = origAreaInfo.series;
            repsPerSet = origAreaInfo.reps;
          }

          let blockReps = calculatedSeries * repsPerSet;

          if (experienceLevel === 'Principiante' && areaKey === 'CF') {
            blockReps = Math.min(36, blockReps);
            calculatedSeries = Math.max(1, Math.round(blockReps / repsPerSet));
            blockReps = calculatedSeries * repsPerSet;
          }

          calculatedSwingsSum += blockReps;

          let eligible = DRILLS_DATABASE.filter(d => d.areaKey === areaKey && !usedDrillIds.has(d.id));
          
          let filtered = eligible.filter(d => d.diff === targetDiff);
          if (filtered.length === 0) filtered = eligible;
          if (filtered.length === 0) filtered = DRILLS_DATABASE.filter(d => d.areaKey === areaKey);

          let chosenDrill = filtered[Math.floor(Math.random() * filtered.length)] || DRILLS_DATABASE[0];
          usedDrillIds.add(chosenDrill.id);

          let modeText = chosenDrill.modes[modeIndex] || chosenDrill.modes[0];

          blocks.push({
            id: chosenDrill.id,
            name: chosenDrill.name,
            areaKey: areaKey,
            area: chosenDrill.area,
            desc: chosenDrill.desc,
            objective: chosenDrill.obj,
            material: chosenDrill.mat,
            mode: modeText,
            series: calculatedSeries,
            repsPerSeries: repsPerSet,
            pct: Math.round(areaWeight * 100),
            reps: blockReps,
            steps: chosenDrill.steps || [],
            focus: chosenDrill.focus || 'Enfoque técnico de la repetición.',
            errorAvoid: chosenDrill.errorAvoid || 'Evitar perder la postura biomecánica.'
          });
        });

        const newSession = {
          ageCategory,
          experienceLevel,
          availableMinutes,
          totalSwings: calculatedSwingsSum,
          selectedCount: selectedObjectives.length,
          blocks
        };

        setCurrentSession(newSession);
        setCompletedBlockIds([]);
        setExpandedDrillIndex(0); // Open detailed execution for first exercise by default
        setActiveTab('session');
      };

      const handleSendWhatsAppPDF = async () => {
        if (!currentSession || !routineRef.current) return;
        setIsGeneratingPdf(true);

        try {
          const element = routineRef.current;
          const opt = {
            margin:       [10, 10, 10, 10],
            filename:     `Rutina_Bateo_Beisbolpower_${currentSession.ageCategory}_${currentSession.experienceLevel}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#0f172a' },

              className={`flex flex-col items-center gap-1 ${activeTab === 'session' ? 'text-orange-500' : 'text-slate-500'}`}
            >
              <i className="fas fa-baseball-bat-ball text-base"></i>
              <span className="text-[10px] font-bold">Rutina</span>
            </button>
            <button 
              onClick={() => setActiveTab('quote')}
              className={`flex flex-col items-center gap-1 ${activeTab === 'quote' ? 'text-orange-500' : 'text-slate-500'}`}
            >
              <i className="fas fa-brain text-base"></i>
              <span className="text-[10px] font-bold">Mente</span>
            </button>
            <button 
              onClick={() => setIsAuthenticated(false)}
              className="flex flex-col items-center gap-1 text-slate-500 hover:text-red-400 transition-colors"
            >
              <i className="fas fa-right-from-bracket text-base"></i>
              <span className="text-[10px] font-bold">Salir</span>
            </button>
          </div>

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
